name: One-Off Titan SMTP Safe Diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'qa/titan-smtp-reason-probe-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One production registration and safe SMTP reason
        run: node scripts/qa-mail-reason-once.mjs
