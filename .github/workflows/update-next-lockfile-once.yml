name: Update Next Lockfile Once
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
permissions:
  contents: write
jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == 'unikmo/planethike' && github.head_ref == 'qa/registration-email-and-release-checks-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and lock patched dependencies
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
      - name: Commit corrected lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lock patched Next.js 15.5.29 dependency tree"
          git push origin HEAD:qa/registration-email-and-release-checks-20261122
